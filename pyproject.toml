[project]
name = "selise-project"
version = "0.1.0"
description = ""
authors = [
    {name = "mahmud",email = "mahmud@nybsys.com"}
]
readme = "README.md"
requires-python = "<4.0,>=3.12"
dependencies = [
    "transformers (>=4.57.3,<5.0.0)",
    "torch (>=2.5.1,<3.0.0)",
    "docling-core (>=2.57.0,<3.0.0)",
    "pymupdf (>=1.26.7,<2.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "unstructured[all-docs] (>=0.18.24,<0.19.0)",
    "pypdf (>=6.5.0,<7.0.0)",
    "pypdf2 (>=3.0.1,<4.0.0)",
    "langchain-text-splitters (>=1.1.0,<2.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "langchain-experimental (>=0.4.1,<0.5.0)"
]

[tool.poetry]
packages = [{include = "selise_project", from = "src"}]


[[tool.poetry.source]]
name = "pytorch_gpu"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch_gpu"}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
